let lang = (function(){ try{return localStorage.getItem('lang')||'zh';}catch(e){return 'zh';} })();
function T(k){ var d=I18N[lang]||I18N.zh; return (d[k]!=null)?d[k]:(I18N.zh[k]!=null?I18N.zh[k]:k); }
function Tf(k,map){ var s=T(k); for(var m in (map||{})){ s=s.split('{'+m+'}').join(map[m]); } return s; }
function bi(o,k){ if(!o) return ''; return (lang==='en' && o[k+'_en']!=null)?o[k+'_en']:(o[k]!=null?o[k]:''); }
function toggleLang(){
  lang = (lang==='zh')?'en':'zh';
  try{ localStorage.setItem('lang', lang); }catch(e){}
  document.documentElement.lang = (lang==='en')?'en':'zh';
  document.getElementById('langToggle').textContent = (lang==='zh')?'EN':'中';
  render();
}

  if(j){ DATA=j; LIVE=!!j.live; }

}).then(r=>r.ok?r.json():null).then(m=>{

    DATA.markets.house_d=m.house_d;

    if(m.sweep!=null) DATA.markets.sweep=m.sweep;

  }
  render();
}).catch(()=>{ render(); });

// ---- 时间序列：每个模型一个 series，date -> x ----
const SERIES_COLORS = ['#e8a23d','#4a90d9','#6fbf73','#caa24a','#d9694a','#9c8a6e','#7aa6d9','#b58fd0','#d0a86f','#86b3a0','#c98f8f'];
function allSeries(chamber){
  const arr=[];
  DATA.models.forEach(m=>{ if(m.history && m.history[chamber]) arr.push({name:m.name,pts:m.history[chamber],color:null,kind:'model'}); });
  if(DATA.markets.history && DATA.markets.history[chamber]) arr.push({name:bi(DATA.markets,'name'),pts:DATA.markets.history[chamber],color:'#e8a23d',kind:'market'});
  return arr;
}
function drawSeries(canvasId, legendId, chamber){
  const cv=document.getElementById(canvasId);
  const W=cv.clientWidth, H=300; cv.width=W*2; cv.height=H*2;
  const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.clearRect(0,0,W,H);
  const padL=44,padR=14,padT=16,padB=34;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  ctx.strokeStyle='#3a2c1d'; ctx.fillStyle='#9c8a6e'; ctx.font='10px sans-serif'; ctx.textAlign='right';
  for(let v=0;v<=100;v+=20){const y=padT+plotH*(1-v/100);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.fillText(v+'%',padL-6,y+3);}
  const series=allSeries(chamber);
  const allPts=series.flatMap(s=>s.pts);
  const xs=allPts.map(p=>dayNum(p.d));
  let xmin=Math.min(...xs, 8*30+1), xmax=Math.max(...xs, 9*30+28);
  const X=d=>padL+plotW*( (dayNum(d)-xmin)/(xmax-xmin) );
  const Y=v=>padT+plotH*(1-v/100);
  let ci=0;
  series.forEach(s=>{ if(s.kind==='market'){s.color='#e8a23d';} else {s.color=SERIES_COLORS[ci%SERIES_COLORS.length];ci++;} });
  series.forEach(s=>{
    const pts=s.pts;
    if(pts.length>=2){
      ctx.strokeStyle=s.color; ctx.lineWidth=s.kind==='market'?2.5:1.8;
      ctx.beginPath();
      pts.forEach((p,i)=>{const x=X(p.d),y=Y(p.v); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.stroke();
      pts.forEach(p=>{ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(X(p.d),Y(p.v),3,0,7);ctx.fill();});
    } else {
      const p=pts[0];
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(X(p.d),Y(p.v),4,0,7);ctx.fill();
      ctx.strokeStyle=s.color;ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(X(p.d),Y(p.v));ctx.lineTo(X(p.d),padT+plotH);ctx.stroke();ctx.setLineDash([]);
    }
  });
  ctx.fillStyle='#9c8a6e'; ctx.textAlign='center'; ctx.font='10px sans-serif';
  [ '08-15','09-01','09-15','09-28' ].forEach(d=>{ if(dayNum(d)>=xmin&&dayNum(d)<=xmax) ctx.fillText(d, X(d), padT+plotH+16); });
  document.getElementById(legendId).innerHTML = series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}${s.kind==='market'?T('legend_live'):''}</span>`).join('')
    + '<span style="color:#9c8a6e">'+T('legend_single')+'</span>';
}

// ---- 分歧快照：横条 + 区间带 ----
function drawDivergence(){
  const models=DATA.models.filter(m=>m.house_d!=null).sort((a,b)=>b.house_d-a.house_d);
  const vals=models.map(m=>m.house_d);
  const lo=Math.min(...vals), hi=Math.max(...vals), med=modelAvgHouse();
  const bandL=(lo/100*100), bandW=((hi-lo)/100*100);
  const dv=document.getElementById('dv'); dv.innerHTML='';
  models.forEach(m=>{
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<div class="nm">${m.name}</div>
      <div class="track"><div class="band" style="left:${bandL}%;width:${bandW}%"></div><div class="dot" style="left:${m.house_d}%"></div></div>
      <div class="val">${pct(m.house_d)}</div>`;
    dv.appendChild(r);
  });
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<div class="nm" style="color:var(--amber2)">${T('div_market_label')}</div>
    <div class="track"><div class="band" style="left:${bandL}%;width:${bandW}%"></div><div class="mk" style="left:${DATA.markets.house_d}%"></div></div>
    <div class="val" style="color:var(--amber2)">${pct(DATA.markets.house_d)}</div>`;
  dv.appendChild(r);
  document.getElementById('rangebar').innerHTML =
    Tf('rangebar',{lo:lo,hi:hi,med:med.toFixed(0),span:(hi-lo)});
}

// ---- 模拟"实时心跳"：市场数值在种子值附近小幅游走（真接入 API 后删除此段） ----
let mHouse=DATA.markets.house_d, mSenate=DATA.markets.senate_d, mSweep=DATA.markets.sweep||62;
function updatePulse(){
  if(LIVE) return;
  mHouse=Math.max(82,Math.min(93,mHouse+(Math.random()-0.5)*0.8));
  mSenate=Math.max(50,Math.min(64,mSenate+(Math.random()-0.5)*0.6));
  mSweep=Math.max(55,Math.min(68,mSweep+(Math.random()-0.5)*0.6));
  const h=document.getElementById('m-house'), s=document.getElementById('m-senate'), d=document.getElementById('m-diff'), w=document.getElementById('m-sweep');
  if(h)h.innerHTML=mHouse.toFixed(1)+'%<span class="pct"> '+(lang==='en'?'House · Dem':'众院·民主党')+'</span>';
  if(s)s.textContent=mSenate.toFixed(1)+'%';
  if(w)w.textContent=mSweep.toFixed(0)+'%';
  if(d){const diff=mHouse-modelAvgHouse(); d.innerHTML=(diff>=0?'+':'−')+Math.abs(diff).toFixed(0)+'<span class="pct"> pt</span>';}
}
setInterval(updatePulse,1500);

render();
window.addEventListener('resize',()=>{drawSeries('chartH','legendH','house');drawSeries('chartS','legendS','senate');});
</script>
